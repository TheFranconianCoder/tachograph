<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)" />
        <meta name="description" content="The local history recorder for every worktree." />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <title>Tachograph</title>
        <script>
            try {
                document.documentElement.dataset.theme =
                    localStorage.getItem('tachograph-theme') || 'auto';
            } catch (error) {
                document.documentElement.dataset.theme = 'auto';
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
